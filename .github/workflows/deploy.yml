name: Desplegar API en Azure

on:
  push:
    branches: [main]
    paths-ignore: ["index.html"]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-mlops-ean
  ACR_NAME: acrmlopseansorco5
  ENVIRONMENT: env-mlops-ean
  APP_NAME: api-mlops-ean
  API_VERSION: "2024-03-01"

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Construir y subir imagen
        run: |
          set -euo pipefail
          IMAGE="$ACR_NAME.azurecr.io/$APP_NAME:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          az acr login --name "$ACR_NAME"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Crear o actualizar la API
        env:
          DB_URL: ${{ secrets.DATABRICKS_URL }}
          DB_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f app.json' EXIT

          SUB=$(az account show --query id -o tsv)
          BASE="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App"
          ENV_ID="/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/managedEnvironments/$ENVIRONMENT"
          APP_URL="$BASE/containerApps/$APP_NAME?api-version=$API_VERSION"

          LOCATION=$(az rest --method get \
            --url "$BASE/managedEnvironments/$ENVIRONMENT?api-version=$API_VERSION" \
            --query location -o tsv)

          ACR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASSWORD"

          jq -n \
            --arg location "$LOCATION" \
            --arg environment "$ENV_ID" \
            --arg image "$IMAGE" \
            --arg server "$ACR_NAME.azurecr.io" \
            --arg username "$ACR_USERNAME" \
            --arg password "$ACR_PASSWORD" \
            --arg databricksUrl "$DB_URL" \
            --arg databricksToken "$DB_TOKEN" \
            '{
              location: $location,
              properties: {
                environmentId: $environment,
                workloadProfileName: "Consumption",
                configuration: {
                  ingress: {external: true, targetPort: 8000},
                  registries: [{
                    server: $server,
                    username: $username,
                    passwordSecretRef: "acr-password"
                  }],
                  secrets: [
                    {name: "acr-password", value: $password},
                    {name: "databricks-url", value: $databricksUrl},
                    {name: "databricks-token", value: $databricksToken}
                  ]
                },
                template: {
                  containers: [{
                    name: "api",
                    image: $image,
                    resources: {cpu: 0.5, memory: "1Gi"},
                    env: [
                      {name: "DATABRICKS_URL", secretRef: "databricks-url"},
                      {name: "DATABRICKS_TOKEN", secretRef: "databricks-token"}
                    ]
                  }],
                  scale: {minReplicas: 0, maxReplicas: 1}
                }
              }
            }' > app.json

          az rest --method put --url "$APP_URL" --body @app.json -o none

          for attempt in $(seq 1 60); do
            STATE=$(az rest --method get --url "$APP_URL" \
              --query properties.provisioningState -o tsv)
            echo "Estado: $STATE"
            if [ "$STATE" = "Succeeded" ]; then
              break
            fi
            if [ "$STATE" = "Failed" ]; then
              echo "El despliegue falló"
              exit 1
            fi
            sleep 10
          done

          if [ "$STATE" != "Succeeded" ]; then
            echo "Tiempo de espera agotado"
            exit 1
          fi

      - name: Mostrar URL de la API
        run: |
          set -euo pipefail
          SUB=$(az account show --query id -o tsv)
          FQDN=$(az rest --method get \
            --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$APP_NAME?api-version=$API_VERSION" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "API publicada en: https://$FQDN"
          echo "Prueba: https://$FQDN/health"