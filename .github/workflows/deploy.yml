name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - uses: actions/checkout@v3

    # 2. Login al Container Registry de Azure
    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: acrmlopseansorco5.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Construir la imagen Docker y subirla al ACR
    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: acrmlopseansorco5.azurecr.io/ml-api:${{ github.sha }}

    # 4. Login a Azure con identidad administrada (OIDC, sin contraseñas)
    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 5. Desplegar en Container Apps
    #    DATABRICKS_URL   → URL del endpoint MLOPS_EAN
    #    DATABRICKS_TOKEN → token de autenticación
    #    create = primer despliegue | update = actualizaciones posteriores
    - name: Deploy to Container Apps
      run: |
        az containerapp secret set \
          --name api-mlops-ean \
          --resource-group rg-mlops-ean \
          --secrets dbtoken="${{ secrets.DATABRICKS_TOKEN }}"
        az containerapp update \
          --name api-mlops-ean \
          --resource-group rg-mlops-ean \
          --image acrmlopseansorco5.azurecr.io/ml-api:${{ github.sha }} \
          --set-env-vars \
            DATABRICKS_URL="${{ secrets.DATABRICKS_URL }}" \
            DATABRICKS_TOKEN=secretref:dbtoken